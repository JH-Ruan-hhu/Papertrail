name: Windows release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and build Windows x64 NSIS
    runs-on: windows-2025
    outputs:
      unsigned-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      version: ${{ steps.package.outputs.version }}
      installer-name: ${{ steps.package.outputs.installer-name }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows x64 NSIS installer
        run: npm run dist

      - name: Verify packaged application
        run: npm run verify:package

      - name: Run packaged smoke tests
        run: npm run smoke:packaged

      - name: Verify release asset scope
        id: package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installerName = "Yanji-Setup-$version-x64.exe"
          $required = @(
            "outputs/$installerName",
            "outputs/$installerName.blockmap",
            "outputs/latest.yml"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing release asset: $file"
            }
          }
          $portable = @(Get-ChildItem -LiteralPath outputs -File | Where-Object { $_.Name -match 'portable' })
          if ($portable.Count -ne 0) { throw "Portable artifacts are not allowed." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer-name=$installerName" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Yanji-${{ steps.package.outputs.version }}-windows-x64-unsigned
          path: outputs/${{ steps.package.outputs.installer-name }}
          if-no-files-found: error
          retention-days: 7

  sign-and-publish:
    name: Sign and publish tagged release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      vars.SIGNPATH_ORGANIZATION_ID != '' &&
      vars.SIGNPATH_PROJECT_SLUG != '' &&
      vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG != ''
    runs-on: windows-2025
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Submit installer to SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.unsigned-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "3600"
          output-artifact-directory: signed-input

      - name: Verify signature and regenerate updater metadata
        shell: pwsh
        run: |
          $expectedName = '${{ needs.build.outputs.installer-name }}'
          $signed = @(Get-ChildItem -LiteralPath signed-input -Filter $expectedName -File -Recurse)
          if ($signed.Count -ne 1) { throw "Expected exactly one signed installer named $expectedName." }
          $signature = Get-AuthenticodeSignature -LiteralPath $signed[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Signed installer is not Authenticode-valid: $($signature.Status)" }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath $signed[0].FullName -Destination "release-assets/$expectedName"
          npm run metadata:update -- "release-assets/$expectedName"

      - name: Upload verified signed release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Yanji-${{ needs.build.outputs.version }}-windows-x64-signed
          path: |
            release-assets/${{ needs.build.outputs.installer-name }}
            release-assets/${{ needs.build.outputs.installer-name }}.blockmap
            release-assets/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ github.ref_name }}' | Out-Null
          gh release upload '${{ github.ref_name }}' release-assets/* --clobber
