<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即写即走</title>
    <link rel="stylesheet" href="capture.css">
  </head>
  <body>
    <main class="capture-card">
      <header>
        <div class="capture-tabs" role="tablist">
          <button class="active" data-mode="schedule" type="button">日程</button>
          <button data-mode="note" type="button">笔记</button>
        </div>
        <span><kbd>Tab</kbd> 切换</span>
      </header>
      <div class="capture-input-shell">
        <div id="captureHighlights" class="capture-highlights" aria-hidden="true"></div>
        <textarea id="captureEditor" class="capture-editor" rows="3" spellcheck="false" aria-label="即写即走输入框" placeholder="例如：明天下午 3 点到 5 点组会 #1"></textarea>
      </div>
      <footer>
        <div id="parseResult" class="parse-result">自动识别时间；#1 红、#2 黄、#3 绿，默认绿色</div>
        <div><span id="submitHint"><kbd>Enter</kbd> 创建</span><span><kbd>Esc</kbd> 关闭</span></div>
      </footer>
    </main>
    <script src="capture.js"></script>
  </body>
</html>
