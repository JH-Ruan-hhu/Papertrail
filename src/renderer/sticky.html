<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悬浮便笺</title>
    <script src="theme-bootstrap.js"></script>
    <link rel="stylesheet" href="motion-tokens.css">
    <link rel="stylesheet" href="sticky.css">
    <link rel="stylesheet" href="v11-layout.css">
    <link rel="stylesheet" href="themes/liquid-glass.css">
  </head>
  <body class="motion-aux-window">
    <header><div class="sticky-brand"><span aria-hidden="true">✦</span><strong>便笺</strong></div><div><button id="pinButton" class="active" type="button">取消置顶</button><button id="closeButton" type="button" aria-label="关闭便笺" title="关闭">×</button></div></header>
    <main><input id="noteTitle" maxlength="300" placeholder="笔记标题"><div class="sticky-toolbar" role="toolbar" aria-label="便笺格式"><button type="button" data-command="undo" title="撤销">↶</button><button type="button" data-command="redo" title="重做">↷</button><button type="button" data-command="bold" title="加粗"><strong>B</strong></button><button type="button" data-command="italic" title="斜体"><em>I</em></button><button type="button" data-command="underline" title="下划线"><u>U</u></button><button type="button" data-command="strikeThrough" title="删除线"><s>S</s></button><button type="button" data-command="insertOrderedList" title="编号列表">1.</button><button type="button" data-command="insertUnorderedList" title="项目符号">•</button></div><div id="noteContent" class="sticky-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="开始记录…" spellcheck="true"></div></main>
    <footer><span id="saveState">已保存</span><small>回车续号 · Ctrl+Enter 保存</small></footer>
    <script src="theme-runtime.js"></script>
    <script src="list-editing.js"></script>
    <script src="sticky.js"></script>
  </body>
</html>
