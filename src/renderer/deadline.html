<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>截止提醒</title>
    <script src="theme-bootstrap.js"></script>
    <link rel="stylesheet" href="motion-tokens.css">
    <link rel="stylesheet" href="deadline.css">
    <link rel="stylesheet" href="v11-layout.css">
    <link rel="stylesheet" href="themes/liquid-glass.css">
  </head>
  <body class="motion-aux-window">
    <div class="star-sky" aria-hidden="true"><i class="stars stars-a"></i><i class="stars stars-b"></i><i class="stars stars-c"></i><span class="horizon-glow"></span></div>
    <main>
      <span class="signal">重要截止提醒</span>
      <h1 id="deadlineTitle">截止时间已到</h1>
      <p id="deadlineTime"></p>
      <p id="deadlineNotes" class="deadline-notes" hidden></p>
      <div id="deadlineMeta" class="deadline-meta" hidden></div>
      <div class="deadline-actions"><button id="snoozeButton" type="button">10 分钟后提醒</button><button id="dismissButton" type="button"><span>我知道了</span><kbd>Enter</kbd></button></div>
    </main>
    <script src="theme-runtime.js"></script>
    <script src="deadline.js"></script>
  </body>
</html>
